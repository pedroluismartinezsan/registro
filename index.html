<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061a32"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Registro PL"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/icon-192.png"><title>Registro Ciudadano | Equipo Pedro León</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#041326;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{display:flex;flex-direction:column;overflow:hidden}header{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(env(safe-area-inset-top) + 9px) 13px 9px;background:#071c35;border-bottom:1px solid #2674ad;min-height:57px}.brand{font-weight:800;letter-spacing:.4px;font-size:15px}.brand span{color:#4dbbff}button,a{font:inherit}button{border:1px solid #488cba;background:#0e3458;color:white;padding:9px 12px;border-radius:10px;cursor:pointer}main{flex:1;min-height:0;position:relative}iframe{display:block;width:100%;height:100%;border:0;background:#041326}#setup{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 80% 10%,#15487a,#041326 65%)}.card{max-width:520px;width:100%;padding:25px;background:#0b2642;border:1px solid #3684bd;border-radius:20px;box-shadow:0 20px 60px #0008}h1{margin:0 0 10px;font-size:24px}p{color:#c0d8eb;line-height:1.6}input{display:block;width:100%;padding:13px;background:#06182b;color:white;border:1px solid #528eb9;border-radius:10px;margin:15px 0}#open{display:none;text-decoration:none;color:#fff;background:#1562b5;padding:12px;border-radius:10px;text-align:center}#msg{font-size:13px;color:#ffd39d}footer{flex:none;display:flex;gap:8px;align-items:center;justify-content:space-between;padding:7px 12px calc(env(safe-area-inset-bottom) + 7px);background:#06182c;color:#a8c4dc;font-size:11px}#external{color:#b8e3ff}#install{display:none}@media(max-width:400px){.brand{font-size:13px}header button{font-size:12px;padding:8px}} </style></head><body>
<header><div class="brand">REGISTRO <span>PEDRO LEÓN</span></div><button id="reload" type="button">Actualizar</button></header>
<main style="display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 75% 15%,#15487a,#041326 70%)"><section class="card" style="text-align:center"><img src="./icons/icon-192.png" width="100" height="100" alt="Icono PL" style="border-radius:23px"><h1 style="margin-top:18px">Registro Ciudadano</h1><p>Equipo Pedro León</p><p>Accede al formulario y al panel administrativo desde Google Apps Script.</p><a id="open" href="https://script.google.com/macros/s/AKfycbwbJ_jkgUYPEYpqH-zJoIjbURtBPwIMTq-eHb9itSd41afWHvP_dWlxAJZkJXNSEEUZ-g/exec" target="_blank" rel="noopener noreferrer" style="display:block">Abrir registro ciudadano</a><p style="font-size:12px">El registro requiere conexión a internet. No se almacenan datos personales en esta página.</p></section></main>
<footer><span>Acceso digital • Registro Ciudadano</span><button id="install" type="button">Instalar</button></footer>
<script>if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));let deferred;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;document.getElementById('install').style.display='inline-block'});document.getElementById('install').addEventListener('click',async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;document.getElementById('install').style.display='none'});</script></body></html>
